{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>RDF Graph Visualizer</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; color: #333; }
        .container { max-width: 1000px; margin: auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .upload-form { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9;}
        .upload-form p { margin-bottom: 15px; }
        .upload-form label { display: block; margin-bottom: 5px; font-weight: bold; }
        .upload-form input[type="file"] { display: block; margin-bottom: 15px; }
        .upload-form button { 
            background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; 
        }
        .upload-form button:hover { background-color: #0056b3; }
        .error { color: #D8000C; background-color: #FFD2D2; padding: 10px; border-radius: 4px; margin-bottom: 20px; border: 1px solid #D8000C;}
        #graph-container { 
            width: 100%; 
            height: 750px; 
            border: 1px solid #ccc; 
            margin-top: 20px;
            background-color: #fff; /* Ensure graph background is white if pyvis default is transparent */
        }
    </style>
    <!-- Pyvis requires Vis.js. cdn_resources='remote' should handle this. -->
    <!-- If issues, uncomment or add these directly: -->
    <!-- <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script> -->
    <!-- <link rel="stylesheet" type="text/css" href="https://unpkg.com/vis-network/styles/vis-network.min.css" /> -->
</head>
<body>
    <div class="container">
        <h1>Upload RDF/XML File to Visualize</h1>

        {% if error_message %}
            <p class="error">{{ error_message }}</p>
        {% endif %}

        <form method="post" enctype="multipart/form-data" class="upload-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Upload and Visualize</button>
        </form>

        {% if graph_html_content %}
            <h2>Generated RDF Graph:</h2>
            <div id="graph-container">
                 {{ graph_html_content|safe }}
            </div>
        {% endif %}
    </div>
</body>
</html>
