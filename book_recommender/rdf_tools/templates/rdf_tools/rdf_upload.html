<!DOCTYPE html>
<html>
<head>
    <title>Upload RDF File</title>
</head>
<body>
    <h1>Upload an RDF File</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="rdf_file">Choose RDF file:</label>
        <input type="file" name="rdf_file" accept=".ttl,.rdf,.nt,.n3,.xml,.jsonld" required><br><br>

        <label for="format">Select RDF format:</label>
        <select name="format">
            <option value="xml">RDF/XML (.rdf)</option>
            <!-- <option value="turtle">Turtle (.ttl)</option>
            <option value="nt">N-Triples (.nt)</option>
            <option value="json-ld">JSON-LD (.jsonld)</option> -->
        </select><br><br>

        <button type="submit">Visualize RDF Graph</button>
    </form>
</body>
</html>
