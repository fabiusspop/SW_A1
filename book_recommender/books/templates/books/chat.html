<style>
    p{
        margin: 0;
        padding: 0;
    }

    .chat {
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px 20px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      align-items: center; 
      background-color: #f4f4f4;
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 1000;
    }

    .prompt-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    .prompt-container input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        width: 200px;
    }

    .prompt-container button {
        padding: 10px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .exit{
        position: absolute;
        top: 5px;
        right: 10px;
        cursor: pointer;
    }

    .trigger{
        position: fixed;
        bottom: 10px;
        right: 10px;
        background-color: #4caf50;
        color: white;
        padding: 10px 20px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 1001;
    }

    .chat-messages {
      overflow-y: scroll;
      max-height: 200px;
      max-width: 400px;
      margin-bottom: 10px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin: 10px;
      padding: 10px;
    }

    .starters-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5px;
        max-width: 80%;
    }

    .starters-container p {
        border: #ccc 1px solid;
        padding: 10px;
        border-radius: 10px;
        background-color: #4caf50;
        color: white;
        cursor: pointer;
    }
  </style>

<div class="trigger">
  <p>ChatBot</p>
</div>

<div class="chat">
  <h2>AI Librarian</h2>

  <div class="starters-container" id="starters-container">
    <!-- Starters will be loaded here -->
  </div>

  <div class="chat-messages" id="chat-messages">
    <!-- Chat messages will appear here -->
  </div>  

  <div class="prompt-container">
    <input type="text" id="prompt" name="prompt" />
    <button id="send-btn">Send</button>
  </div>

  <p class="exit">X</p>
</div>

<script>
    const exit = document.querySelector('.exit');
    const trigger = document.querySelector('.trigger');
    const chat = document.querySelector('.chat');
    const chatMessages = document.getElementById('chat-messages');
    const sendBtn = document.getElementById('send-btn');
    const promptInput = document.getElementById('prompt');
    const startersContainer = document.getElementById('starters-container');

    exit.addEventListener('click', () => {
        chat.style.display = 'none';
        trigger.style.display = 'block';
    });

    trigger.addEventListener('click', () => {
        chat.style.display = 'flex';
        trigger.style.display = 'none';
        loadStarters();
    });

    function addMessage(text, sender) {
        const p = document.createElement('p');
        p.textContent = (sender === 'user' ? 'You: ' : 'Bot: ') + text;
        chatMessages.appendChild(p);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendBtn.onclick = async function(e) {
        e.preventDefault();
        const prompt = promptInput.value;
        if (!prompt) return;
        addMessage(prompt, 'user');
        promptInput.value = '';
        const res = await fetch('/api/chat/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: prompt})
        });
        const data = await res.json();
        addMessage(data.response, 'bot');
    };

    function loadStarters() {
        // Example: get context from page (customize as needed)
        let context = 'list';
        let bookTitle = '';
        if (window.location.pathname.includes('book_details')) {
            context = 'book';
            // Try to extract book title from page (customize as needed)
            const h1 = document.querySelector('h1');
            if (h1) bookTitle = h1.textContent;
        }
        let url = `/api/chat/starters/?context=${context}`;
        if (bookTitle) url += `&book_title=${encodeURIComponent(bookTitle)}`;
        fetch(url)
            .then(res => res.json())
            .then(data => {
                startersContainer.innerHTML = '';
                data.starters.forEach(starter => {
                    const p = document.createElement('p');
                    p.textContent = starter;
                    p.onclick = () => {
                        promptInput.value = starter;
                    };
                    startersContainer.appendChild(p);
                });
            });
    }

    // Load starters on page load if chat is open
    if (chat.style.display === 'flex') {
        loadStarters();
    }
</script>
